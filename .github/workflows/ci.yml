# CI: на кожен push у master і на кожен pull request GitHub бере чисту машину, збирає переносиму
# частину pi-tracker (portable/: протоколи, серійний порт, парсери) і запускає модульні тести.
# Камера, GStreamer і Hailo тут не збираються — на серверах GitHub їх немає
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-26]

    steps:
      - uses: actions/checkout@v7 # готовий крок від GitHub: git clone вашого репозиторію

      - name: Configure
        run: cmake -S portable -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7 # готовий крок від GitHub: git clone вашого репозиторію

      - name: Configure
        run: cmake -S portable -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-fno-sanitize-recover=all -fno-omit-frame-pointer -fsanitize=address -fsanitize=undefined -D_GLIBCXX_ASSERTIONS"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure 